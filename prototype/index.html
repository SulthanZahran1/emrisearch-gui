<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emrisearch explorer</title>
<style>
  :root {
    --bg: #0b0d10;
    --surface: #101318;
    --raised: #15181d;
    --hairline: #23272e;
    --hairline-strong: #2e333c;
    --text: #d7dae0;
    --dim: #8b919c;
    --faint: #7a8190;
    --accent: #e05d6f;
    --accent-dim: #e88a97;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html[data-theme="light"] {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --raised: #fafbfc;
    --hairline: #dde0e5;
    --hairline-strong: #c6cbd3;
    --text: #1c2026;
    --dim: #4b515c;
    --faint: #5f6672;
    --accent: #c23a4e;
    --accent-dim: #a02f40;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); }
  .faint { color: var(--faint); }
  .accent { color: var(--accent); }

  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100dvh; }

  @media (min-width: 769px) {
    .rail { position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
  }

  /* ---------- rail ---------- */
  .rail {
    border-right: 1px solid var(--hairline);
    background: var(--surface);
    display: flex; flex-direction: column;
    min-height: 100dvh;
  }
  .rail-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .wordmark { font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em; }
  .wordmark b { color: var(--accent); font-weight: 600; }
  .root-path {
    margin-top: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rail-actions {
    display: flex; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .add-run {
    display: flex; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .add-run[hidden] { display: none; }
  .add-run input {
    flex: 1; min-width: 0;
    background: var(--bg); border: 1px solid var(--hairline);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 6px 10px;
  }
  .add-run input:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  .add-run input::placeholder { color: var(--faint); }
  .icon-btn {
    background: none; border: 1px solid var(--hairline); color: var(--dim);
    font-family: var(--mono); font-size: 12px; padding: 4px 10px; cursor: pointer;
    border-radius: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--hairline-strong); }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  .chain-group { border-bottom: 1px solid var(--hairline); }
  .chain-label {
    padding: 8px 16px 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint);
  }
  .run-row {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
    padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent;
  }
  .run-row:hover { background: var(--raised); }
  .run-row.active { border-left-color: var(--accent); background: var(--raised); }
  .run-row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .run-name { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .run-row.active .run-name { color: var(--accent); }
  .run-kind { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .run-meta { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
  .run-meta .ld { color: var(--faint); }

  /* ---------- main ---------- */
  .main { min-width: 0; }
  .main-head {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--hairline);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .secnav { display: flex; gap: 2px; }
  .secnav a {
    color: var(--dim); text-decoration: none;
    font-family: var(--mono); font-size: 12px;
    padding: 4px 10px; border-bottom: 2px solid transparent;
  }
  .secnav a:hover { color: var(--text); }
  .secnav a.active { color: var(--text); border-bottom-color: var(--accent); }
  .theme-toggle {
    background: none; border: 1px solid var(--hairline); color: var(--dim);
    font-family: var(--mono); font-size: 12px; padding: 4px 10px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--hairline-strong); }

  .content { padding: 0 24px 80px; max-width: 1280px; }

  /* empty state */
  .empty {
    padding: 120px 24px; text-align: left;
  }
  .empty h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .empty p { margin-top: 10px; color: var(--dim); max-width: 52ch; }

  /* run header */
  .run-head { padding: 20px 0 0; }
  .lineage {
    display: flex; align-items: center; gap: 0;
    margin-bottom: 18px; flex-wrap: wrap;
  }
  .lineage .node {
    display: flex; align-items: center; gap: 8px;
    background: none; border: 1px solid var(--hairline);
    color: var(--dim); font-family: var(--mono); font-size: 11.5px;
    padding: 5px 12px; cursor: pointer;
  }
  .lineage .node:hover { color: var(--text); border-color: var(--hairline-strong); }
  .lineage .node.current { border-color: var(--accent); color: var(--accent); }
  .lineage .node .idx { color: var(--faint); }
  .lineage .node.current .idx { color: var(--accent-dim); }
  .lineage .arrow { color: var(--faint); font-family: var(--mono); font-size: 12px; padding: 0 8px; }
  .run-title { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .run-path { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-top: 4px; overflow-wrap: anywhere; }
  .run-facts {
    display: flex; flex-wrap: wrap; gap: 0;
    margin-top: 14px; border-top: 1px solid var(--hairline);
  }
  .fact {
    padding: 10px 20px 10px 0; margin-right: 20px;
  }
  .fact .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .fact .v { font-family: var(--mono); font-size: 13px; margin-top: 2px; }

  /* sections */
  section.block { padding: 28px 0 8px; border-bottom: 1px solid var(--hairline); scroll-margin-top: 64px; }
  .block-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 4px 12px; }
  .block-head h2 { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .block-head .note { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0; }
  .kv { padding: 7px 0; border-top: 1px solid var(--hairline); min-width: 0; }
  .kv .k { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .kv .v { font-family: var(--mono); font-size: 12.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv .v.long { white-space: normal; word-break: break-all; }

  .group-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dim);
    margin: 22px 0 2px;
  }
  .group-label:first-child { margin-top: 0; }

  /* tables */
  table.data { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; }
  table.data th {
    text-align: left; font-weight: 400; color: var(--faint);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 12px 6px 0; border-bottom: 1px solid var(--hairline-strong);
  }
  table.data td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--hairline); }
  table.data tr:last-child td { border-bottom: none; }
  table.data td.num { text-align: right; }
  table.data th.num { text-align: right; }
  table.data .warn { color: var(--accent); }
  table.data .ok { color: var(--dim); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  @media (max-width: 1000px) { .two-col { grid-template-columns: 1fr; gap: 24px; } }

  .big-ld { font-family: var(--mono); font-size: 26px; color: var(--accent); letter-spacing: -0.02em; }
  .stat-line { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 4px; }

  .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 1000px) { .figs { grid-template-columns: 1fr; } }
  .fig { border: 1px solid var(--hairline); }
  .fig img { width: 100%; display: block; }
  .fig-cap { padding: 8px 12px; border-top: 1px solid var(--hairline); font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .fig-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--hairline);
  }
  .fig-head .fig-title { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .fig-actions { display: flex; gap: 6px; align-items: center; }
  .fig-actions button, .fig-actions a {
    background: none; border: 1px solid var(--hairline); color: var(--dim);
    font-family: var(--mono); font-size: 10.5px; padding: 3px 8px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .fig-actions button:hover, .fig-actions a:hover { color: var(--text); border-color: var(--hairline-strong); }
  .fig-config {
    border-bottom: 1px solid var(--hairline); padding: 10px 12px;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
  }
  .fig-config[hidden] { display: none; }
  .fig-config label {
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .fig-config .check { flex-direction: row; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--dim); }
  .fig-config .check input { accent-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--hairline); }
  .seg button {
    background: none; border: none; border-right: 1px solid var(--hairline);
    color: var(--dim); font-family: var(--mono); font-size: 11px;
    padding: 4px 10px; cursor: pointer;
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent); color: var(--bg); }
  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-wrap input[type="range"] { accent-color: var(--accent); width: 120px; }
  .slider-wrap .val { font-size: 12px; color: var(--text); min-width: 3ch; }
  .fig-regen { opacity: 0.35; transition: opacity 0.2s; }

  .modal-back {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--hairline-strong);
    max-width: 640px; width: 100%; max-height: 80dvh; display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--hairline);
  }
  .modal-head .t { font-family: var(--mono); font-size: 12px; }
  .modal-head button {
    background: none; border: 1px solid var(--hairline); color: var(--dim);
    font-family: var(--mono); font-size: 11px; padding: 3px 8px; cursor: pointer;
  }
  .modal-head button:hover { color: var(--text); border-color: var(--hairline-strong); }
  .modal pre {
    margin: 0; padding: 14px; overflow: auto;
    font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--text); white-space: pre;
  }

  .legend-note { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 10px; }

  .fig-missing {
    display: flex; align-items: center; justify-content: center;
    min-height: 200px; color: var(--faint);
    font-family: var(--mono); font-size: 12px;
    border: 1px dashed var(--hairline-strong); margin: 0;
  }

  .toast {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    background: var(--raised); border: 1px solid var(--hairline-strong);
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 10px 16px; z-index: 50; max-width: 90vw;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .toast b { color: var(--accent); font-weight: 600; }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .rail { min-height: auto; border-right: none; border-bottom: 1px solid var(--hairline); }
    .chain-group { border-bottom: none; }
    .chain-label { display: none; }
    .run-row { padding: 6px 16px; }
    .content { padding: 0 16px 60px; }
    .main-head { padding: 10px 16px; }
    .secnav { overflow-x: auto; }
    .secnav a { padding: 12px 10px; }
    .lineage .node { min-height: 44px; }
    .theme-toggle { padding: 10px 12px; min-height: 44px; display: inline-flex; align-items: center; }
    .icon-btn { padding: 8px 12px; min-height: 44px; display: inline-flex; align-items: center; }
    .fig-actions button, .fig-actions a { padding: 8px 10px; min-height: 44px; display: inline-flex; align-items: center; }
    .seg button { padding: 8px 10px; min-height: 44px; display: inline-flex; align-items: center; }
    .slider-wrap input[type="range"] { width: 110px; }
    .fig-config .check { min-height: 44px; }
  }
</style>
</head>

  <main class="main">

      </nav>
      <button class="theme-toggle" id="themeBtn" title="toggle theme">dark</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

const CHAIN_ORDER = ["chain 1", "loose"];
const CHAIN_LABEL = { "chain 1": "emri_c_s12", loose: "loose runs" };

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (x, d = 2) => Number(x).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const fmtInt = (x) => Number(x).toLocaleString("en-US");
const phys = (name, v) => {
  if (name === "log10_m1") return (10 ** v).toExponential(1) + " Msun";
  if (name === "log10_m2") return (10 ** v).toFixed(1) + " Msun";
  if (name === "qS") return Math.acos(v).toFixed(3) + " rad";
  return v.toFixed(3);
};

function runById(id) { return RUNS.find((r) => r.id === id); }
function chainOf(run) { return RUNS.filter((r) => r.chain === run.chain); }
function lineageOf(run) {
  const seedTarget = (r) => {
    if (!r.manifest.seeding || r.manifest.seeding.kind !== "from_run") return null;
    return r.manifest.seeding.path.replace(/\/+$/, "").split("/").pop() || null;
  };
  // ancestors, oldest first (follow from_run pointers backward, cycle-safe)
  const anc = [];
  const seen = new Set();
  let cur = run;
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    anc.unshift(cur);
    cur = seedTarget(cur) ? runById(seedTarget(cur)) : null;
  }
  // descendants, transitively, across ALL runs (not just the same chain label)
  const desc = [];
  let changed = true;
  while (changed) {
    changed = false;
    for (const r of RUNS) {
      if (anc.includes(r) || desc.includes(r)) continue;
      const p = seedTarget(r);
      if (p && (anc.some((x) => x.id === p) || desc.some((x) => x.id === p))) { desc.push(r); changed = true; }
    }
  }
  return anc.concat(desc);
}

/* ---------- rail ---------- */
function renderRail(activeId) {
  const nav = $("#runList");
  let html = "";
  for (const c of CHAIN_ORDER) {
    const runs = RUNS.filter((r) => r.chain === c);
    html += `<div class="chain-group"><div class="chain-label">${esc(CHAIN_LABEL[c])}</div>`;
    for (const r of runs) {
      const kind = r.manifest.seeding.kind;
      const dims = r.manifest.space.free.length;
      html += `<div class="run-row${r.id === activeId ? " active" : ""}" data-run="${r.id}" role="button" tabindex="0"${r.id === activeId ? ' aria-current="true"' : ""}>
        <div class="run-name">${esc(r.id)}</div>
        <div class="run-meta">${fmt(r.result.best.ld, 1)}</div>
        <div class="run-kind">${esc(kind)} · ${dims}d</div>
        <div class="run-meta">${esc(r.manifest.statistic.kind)}</div>
      </div>`;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
  nav.querySelectorAll(".run-row").forEach((row) => {
    const go = () => { location.hash = "#/run/" + row.dataset.run; };
    row.addEventListener("click", go);
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

/* ---------- run detail ---------- */
function kv(k, v, long) {
  return `<div class="kv"><div class="k">${esc(k)}</div><div class="v${long ? " long" : ""}" title="${esc(String(v))}">${v}</div></div>`;
}

function renderManifest(run) {
  const m = run.manifest;
  const src = m.source;
  const srcKeys = Object.keys(src);
  const srcHtml = srcKeys.map((k) => kv(k, fmt(src[k], 4))).join("");
  const freeHtml = m.space.free.map((f) =>
    `<tr><td>${esc(f.name)}</td><td>${esc(f.transform)}</td><td class="num">${fmt(f.lo, 3)}</td><td class="num">${fmt(f.hi, 3)}</td></tr>`
  ).join("");
  const fixedHtml = Object.entries(m.space.fixed).map(([k, v]) => kv(k, fmt(v, 3))).join("");
  const s = m.sampler;
  const samplerKeys = Object.keys(s).filter((k) => s[k] !== undefined);
  const samplerHtml = samplerKeys.map((k) => kv(k, s[k] === null ? "null" : typeof s[k] === "number" ? fmt(s[k], 3) : esc(String(s[k])))).join("");
  const seed = m.seeding;
  const seedHtml = Object.entries(seed).map(([k, v]) => kv(k, typeof v === "number" ? fmt(v, 3) : esc(String(v)), k === "path")).join("");
  const ann = m.anneal;
  const annHtml = ann
    ? Object.entries(ann).map(([k, v]) => kv(k, Array.isArray(v) ? v.join(", ") : esc(String(v)))).join("")
    : `<div class="kv"><div class="k">anneal</div><div class="v dim">none (this stage is not annealed)</div></div>`;

  return `
  <section class="block" id="manifest">
    <div class="block-head">
      <h2>manifest</h2>
      <div class="note">emrisearch ${esc(m.emrisearch_version)}</div>
    </div>
    <div class="group-label">source</div>
    <div class="kv-grid">${srcHtml}</div>
    <div class="group-label">observation / noise / modes</div>
    <div class="kv-grid">
      ${kv("T", fmt(m.obs.T, 2) + " yr")}${kv("dt", fmt(m.obs.dt, 1) + " s")}
      ${kv("tdi_gen", esc(m.obs.tdi_gen))}${kv("use_gpu", String(m.obs.use_gpu))}
      ${kv("pad_output", String(m.obs.pad_output))}${kv("T_from_plunge", String(m.obs.T_from_plunge))}
      ${kv("T_margin", m.obs.T_margin === undefined ? "unset" : fmt(m.obs.T_margin, 1))}
      ${kv("noise.add", String(m.noise.add))}${kv("noise.seed", String(m.noise.seed))}
      ${kv("ell", String(m.modes.ell))}${kv("n_vals", m.modes.n_vals.join(", "))}
      ${kv("N_traj", String(m.modes.N_traj))}${kv("M_mode", m.modes.M_mode === undefined ? "unset" : m.modes.M_mode === null ? "null" : String(m.modes.M_mode))}
      ${kv("mode_select", m.modes.mode_select ? m.modes.mode_select.join(", ") : "null")}
    </div>
    <div class="group-label">statistic</div>
    <div class="kv-grid">
      ${kv("kind", esc(m.statistic.kind))}
      ${Object.entries(m.statistic).filter(([k]) => k !== "kind").map(([k, v]) => kv(k, esc(String(v)))).join("")}
    </div>
    <div class="group-label">search space</div>
    <table class="data">
      <tr><th>param</th><th>transform</th><th class="num">lo</th><th class="num">hi</th></tr>
      ${freeHtml}
    </table>
    <div class="group-label">fixed params</div>
    <div class="kv-grid">${fixedHtml}</div>
    <div class="group-label">sampler</div>
    <div class="kv-grid">${samplerHtml}</div>
    <div class="group-label">seeding</div>
    <div class="kv-grid">${seedHtml}</div>
    <div class="group-label">anneal</div>
    <div class="kv-grid">${annHtml}</div>
  </section>`;
}

function renderBest(run) {
  const res = run.result;
  const dims = run.manifest.space.free;
  const bestRows = dims.map((d, i) => {
    const ns = res.n_sigma[i];
    const warn = ns > 2;
    return `<tr>
      <td>${esc(d.name)}</td>
      <td class="num">${fmt(res.best.coords[i], 3)}</td>
      <td class="num dim">${esc(phys(d.name, res.best.coords[i]))}</td>
      <td class="num ${warn ? "warn" : "ok"}">${fmt(ns, 2)}</td>
    </tr>`;
  }).join("");
  const procRows = res.best_per_process.map((p) =>
    `<tr><td>proc ${p.proc}</td><td class="num">${fmt(p.ld, 1)}</td></tr>`
  ).join("");
  const merged = res.spread < 5;
  const finitePct = (100 * res.n_finite / res.n_samples).toFixed(1);

  return `
  <section class="block" id="best">
    <div class="block-head">
      <h2>best point</h2>
      <div class="note">search coords · physical · n_sigma to contain truth</div>
    </div>
    <div class="two-col">
      <div>
        <div class="big-ld">${fmt(res.best.ld, 1)}</div>
        <div class="stat-line">best log-density · ${esc(run.manifest.statistic.kind)}</div>
        <table class="data" style="margin-top:16px">
          <tr><th>param</th><th class="num">search</th><th class="num">physical</th><th class="num">n_sigma</th></tr>
          ${bestRows}
        </table>
        <div class="legend-note">n_sigma = (truth - best) / sigma per dim, from n_sigma_to_contain(). Values above 2 are flagged.</div>
      </div>
      <div>
        <div class="group-label">best per process</div>
        <table class="data">
          <tr><th>process</th><th class="num">best log-density</th></tr>
          ${procRows}
        </table>
        <div class="legend-note">spread ${fmt(res.spread, 1)} · ${merged ? "processes agree, run looks merged" : "processes disagree, run is not merged"}</div>
        <div class="group-label" style="margin-top:20px">samples</div>
        <div class="kv-grid">
          ${kv("total", fmtInt(res.n_samples))}
          ${kv("finite", fmtInt(res.n_finite) + " (" + finitePct + "%)")}
        </div>
      </div>
    </div>
  </section>`;
}

function renderDetail(run) {
  const lineage = lineageOf(run);
  const lineageHtml = lineage.map((r, i) => {
    const kind = r.manifest.anneal ? "anneal" : r.manifest.seeding.kind === "from_run" ? "merge" : r.manifest.seeding.kind;
    const label = kind === "internal_lhs" ? "lhs seed" : kind;
    const arrow = i < lineage.length - 1 ? `<span class="arrow">→</span>` : "";
    return `<button class="node${r.id === run.id ? " current" : ""}" data-run="${r.id}"${r.id === run.id ? ' aria-current="true"' : ""}>
      <span class="idx">${String(i + 1).padStart(2, "0")}</span>${esc(label)}
    </button>${arrow}`;
  }).join("");
  const m = run.manifest;
  const facts = [
    ["statistic", m.statistic.kind],
    ["T", fmt(m.obs.T, 2) + " yr"],
    ["dims", String(m.space.free.length) + "d"],
    ["samples", fmtInt(run.result.n_samples)],
    ["seeding", m.seeding.kind],
    ["anneal", m.anneal ? "S_final " + fmt(m.anneal.S_final, 1) : "none"]
  ].map(([k, v]) => `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

  return `
  <div class="run-head">
    <div class="lineage">${lineageHtml}</div>
    <div class="run-title">${esc(run.id)}</div>
    <div class="run-path">${esc(m.out)}</div>
    <div class="run-facts">${facts}</div>
  </div>
  ${renderManifest(run)}
  ${renderBest(run)}
  ${renderPlots(run)}`;
}

/* ---------- routing ---------- */
function route() {
  let m = null;
  try { m = location.hash.match(/^#\/run\/(.+)$/); } catch (e) { m = null; }
  const content = $("#content");
  if (!m) {
    renderRail(null);
    content.innerHTML = renderEmpty();
    return;
  }
  let run = null;
  let requested = null;
  try { requested = decodeURIComponent(m[1]); run = runById(requested); } catch (e) { run = null; }
  if (!run) {
    renderRail(null);
    content.innerHTML = requested
      ? `<div class="empty">
          <h1>Run not found</h1>
          <p><span class="mono">${esc(requested)}</span> is not in the run list. It may have been removed, or the path may be wrong.</p>
          <p style="margin-top:14px"><a href="#" class="icon-btn" id="backToRuns" style="text-decoration:none">back to run list</a></p>
        </div>`
      : renderEmpty();
    const back = content.querySelector("#backToRuns");
    if (back) back.addEventListener("click", (e) => { e.preventDefault(); location.hash = "#/"; });
    return;
  }
  renderRail(run.id);
  content.innerHTML = renderDetail(run);
  content.querySelectorAll(".lineage .node").forEach((n) => {
    n.addEventListener("click", () => { location.hash = "#/run/" + n.dataset.run; });
  });
  // plot actions: config toggle, png download, code modal
  content.querySelectorAll("[data-act]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      const act = el.dataset.act;
      const figName = el.dataset.fig;
      if (act === "config") {
        const panel = content.querySelector(`[data-config="${figName}"]`);
        if (panel) panel.hidden = !panel.hidden;
      } else if (act === "png") {
        const img = content.querySelector(`[data-img="${figName}"]`);
        if (img) {
          if (img.dataset.busy) { toast("figure is re-rendering, try again in a moment"); return; }
          const a = document.createElement("a");
          a.href = img.src;
          a.download = img.src.split("/").pop();
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
      } else if (act === "code") {
        const panel = content.querySelector(`[data-config="${figName}"]`);
        const opts = {};
        if (panel) {
          const themeBtn = panel.querySelector('[data-seg="theme"] button.on');
          if (themeBtn) opts.theme = themeBtn.dataset.v;
          const sl = panel.querySelector('input[type="range"]');
          if (sl) opts[sl.dataset.opt] = parseInt(sl.value, 10);
          const tBtn = panel.querySelector('[data-seg="t_range"] button.on');
          if (tBtn) opts.t_range = tBtn.dataset.v;
          panel.querySelectorAll("input[type='checkbox']").forEach((cb) => { opts[cb.dataset.opt] = cb.checked; });
        }
        showCodeModal(run, figName, opts);
      }
    });
  });
  // config -> output coupling: every change swaps the figure to the matching variant
  content.querySelectorAll(".fig-config").forEach((panel) => {
    const figName = panel.dataset.config;
    const img = content.querySelector(`[data-img="${figName}"]`);
    if (!img) return;
    const key = run.id + "|" + figName;
    const st = plotState.get(key) || { theme: "default", top_n: 10, annotate: true, truth: true, n: 81, t0: -3, t1: 13 };
    plotState.set(key, st);
    const fileFor = () => figName === "corner"
      ? `${run.id}_corner_${st.theme}_top${st.top_n}_a${st.annotate ? 1 : 0}_t${st.truth ? 1 : 0}.png`
      : `${run.id}_connection_${st.theme}_n${st.n}_t${st.t0}_${st.t1}.png`;
    const apply = () => {
      const file = fileFor();
      img.classList.add("fig-regen");
      img.dataset.busy = "1";
      const probe = new Image();
      probe.onload = () => {
        if (!img.isConnected) return; // run navigated away: ignore entirely
        if (probe.src !== img.dataset.pending) return; // stale probe
        img.style.display = "";
        const ph = img.parentNode && img.parentNode.querySelector(".fig-missing");
        if (ph) ph.remove();
        img.src = "figs/" + file;
        delete img.dataset.busy; // only the owning probe clears busy
        img.onload = () => img.classList.remove("fig-regen"); // visual only
      };
      probe.onerror = () => {
        if (!img.isConnected) return;
        if (probe.src !== img.dataset.pending) return;
        img.classList.remove("fig-regen");
        delete img.dataset.busy;
        toast("no pre-rendered variant for this config (mock limit)");
      };
      probe.src = "figs/" + file;
      img.dataset.pending = probe.src; // absolute, matches probe.src
    };
    // restore DOM controls from persisted state
    const themeSeg = panel.querySelector('[data-seg="theme"]');
    if (themeSeg) {
      themeSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === st.theme));
      themeSeg.dataset.chosen = st.chosen ? "1" : "";
    }
    const sl = panel.querySelector('input[type="range"]');
    if (sl) { sl.value = String(st[sl.dataset.opt]); const v = panel.querySelector(`[data-val="${sl.dataset.opt}"]`); if (v) v.textContent = sl.value; }
    const tSeg = panel.querySelector('[data-seg="t_range"]');
    if (tSeg) {
      const label = (st.t0 / 10).toFixed(1) + ", " + (st.t1 / 10).toFixed(1);
      tSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === label));
    }
    panel.querySelectorAll("input[type='checkbox']").forEach((cb) => { cb.checked = !!st[cb.dataset.opt]; });
    // initial render honors the app theme unless the user chose a plot theme
    if (!st.chosen) {
      const target = document.documentElement.dataset.theme === "dark" ? "dark" : "default";
      st.theme = target;
      if (themeSeg) themeSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === target));
    }
    apply();
    panel.querySelectorAll("[data-seg]").forEach((seg) => {
      seg.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        seg.querySelectorAll("button").forEach((b) => b.classList.remove("on"));
        btn.classList.add("on");
        const key2 = seg.dataset.seg;
        if (key2 === "theme") {
          st.theme = btn.dataset.v;
          st.chosen = true;
          seg.dataset.chosen = "1";
        } else if (key2 === "t_range") {
          const [a, b] = btn.dataset.v.split(",").map((s) => parseFloat(s.trim()));
          st.t0 = Math.round(a * 10);
          st.t1 = Math.round(b * 10);
        }
        apply();
      });
    });
    panel.querySelectorAll("input[type='range']").forEach((sl2) => {
      const key2 = sl2.dataset.opt;
      const valEl = panel.querySelector(`[data-val="${key2}"]`);
      const allowed = key2 === "top_n" ? [10, 20, 50, 100] : [41, 81, 161];
      const snap = (v) => allowed.reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
      const setVal = (v) => {
        sl2.value = String(v);
        st[key2] = v;
        if (valEl) valEl.textContent = String(v);
        apply();
      };
      sl2.addEventListener("input", () => setVal(snap(parseInt(sl2.value, 10))));
      sl2.addEventListener("keydown", (e) => {
        const cur = parseInt(sl2.value, 10);
        let next = null;
        if (e.key === "ArrowRight" || e.key === "ArrowUp") {
          next = allowed.find((v) => v > cur) ?? cur;
        } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
          next = [...allowed].reverse().find((v) => v < cur) ?? cur;
        } else if (e.key === "Home") {
          next = allowed[0];
        } else if (e.key === "End") {
          next = allowed[allowed.length - 1];
        }
        if (next !== null && next !== cur) {
          e.preventDefault();
          setVal(next);
        }
      });
    });
    panel.querySelectorAll("input[type='checkbox']").forEach((cb) => {
      const key2 = cb.dataset.opt;
      cb.addEventListener("change", () => {
        st[key2] = cb.checked;
        apply();
      });
    });
  });
  spy();
}

/* module-level plot state: survives route changes */
const plotState = new Map();

/* app theme -> plot theme sync (only when the user has not chosen a plot theme) */
function syncPlotThemes() {
  const appTheme = document.documentElement.dataset.theme;
  const target = appTheme === "dark" ? "dark" : "default";
  document.querySelectorAll(".fig-config").forEach((panel) => {
    const seg = panel.querySelector('[data-seg="theme"]');
    if (!seg || seg.dataset.chosen) return;
    const figName = panel.dataset.config;
    const img = document.querySelector(`[data-img="${figName}"]`);
    if (!img) return;
    const runId = img.dataset.runid;
    if (!runId) return;
    const key = runId + "|" + figName;
    const st = plotState.get(key);
    if (!st) return;
    if (st.theme === target) return;
    st.theme = target;
    seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === target));
    const file = figName === "corner"
      ? `${runId}_corner_${st.theme}_top${st.top_n}_a${st.annotate ? 1 : 0}_t${st.truth ? 1 : 0}.png`
      : `${runId}_connection_${st.theme}_n${st.n}_t${st.t0}_${st.t1}.png`;
    img.classList.add("fig-regen");
    img.dataset.busy = "1";
    const probe = new Image();
    probe.onload = () => {
      if (!img.isConnected) return;
      if (probe.src !== img.dataset.pending) return;
      img.src = "figs/" + file;
      delete img.dataset.busy;
      img.onload = () => img.classList.remove("fig-regen");
    };
    probe.onerror = () => {
      if (!img.isConnected) return;
      if (probe.src !== img.dataset.pending) return;
      img.classList.remove("fig-regen");
      delete img.dataset.busy;
    };
    probe.src = "figs/" + file;
    img.dataset.pending = probe.src;
  });
}
const themeBtn = $("#themeBtn");
if (themeBtn && !themeBtn.dataset.synced) {
  themeBtn.dataset.synced = "1";
  themeBtn.addEventListener("click", () => setTimeout(syncPlotThemes, 0));
}
// cross-tab theme reconciliation
window.addEventListener("storage", (e) => {
  if (e.key !== "emrisearch-theme" || !e.newValue) return;
  applyTheme(e.newValue);
  setTimeout(syncPlotThemes, 0);
});

function showCodeModal(run, figName, opts) {
  opts = opts || {};
  const out = run.manifest.out;
  const theme = opts.theme || "default";
  const themeNote = theme === "default" ? "" : `\n# theme: ${theme} (matplotlib rcParams)`;
  const truthNote = figName === "corner" && opts.truth === false
    ? `\n# truth lines off: upstream corner_frame(truth=True) draws them; the GUI\n# hides them by post-processing the figure (mock-only in this prototype)`
    : "";
  const mockBanner = (theme !== "default" || (figName === "corner" && opts.truth === false))
    ? `\n# NOTE: this snippet reproduces the data, not the exact render. Theme and\n# truth-line toggles are prototype mock features; upstream has no such args.`
    : "";
  const code = figName === "corner"
    ? `from emrisearch.run import load_run\nfrom emrisearch.plotting.corner_plot import plot_result${themeNote}${truthNote}${mockBanner}\n\nres = load_run(${JSON.stringify(out)})\nfig = plot_result(res, top_n=${opts.top_n ?? 10}, annotate=${opts.annotate === false ? "False" : "True"})\nfig.savefig("${run.id}_corner.png", dpi=150)`
    : `# NOTE: needs the heavy stack (lisatools, fastlisaresponse, parismc).\n# run is the ParisRun that produced the output; load_run alone cannot\n# rebuild a bound statistic from the manifest.\nfrom emrisearch.plotting.connection import connection\n\nres = run.result()                       # or load_run(${JSON.stringify(out)})\nbest = res.finite().best                 # property, search coordinates\nspace = res.param_space()\ntruth = space.truth_search\nf = run.statistic.bind(run.data)         # bound statistic callable\nax, t, vals = connection(f, truth, best, t_range=(${opts.t_range ?? "-0.3, 1.3"}), n=${opts.n ?? 81}, space=space)\nax.figure.savefig("${run.id}_connection.png", dpi=150)`;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.setAttribute("role", "dialog");
  back.setAttribute("aria-modal", "true");
  back.setAttribute("aria-label", figName + " export code");
  back.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <span class="t">${esc(figName)} · export code</span>
        <button data-close>close</button>
      </div>
      <pre>${esc(code)}</pre>
    </div>`;
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); trigger.focus(); };
  const onKey = (e) => {
    if (e.key === "Escape") { e.preventDefault(); close(); return; }
    if (e.key === "Tab") {
      const focusables = back.querySelectorAll('button, [href], pre[tabindex="0"]');
      if (!focusables.length) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  back._onKey = onKey;
  const trigger = document.activeElement;
  back.addEventListener("click", (e) => { if (e.target === back || e.target.dataset.close !== undefined) close(); });
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(back);
  const closeBtn = back.querySelector("[data-close]");
  if (closeBtn) closeBtn.focus();
}

/* section nav: scroll only, never touch the hash (hash owns the run route) */
const secs = ["manifest", "best", "plots"];
document.querySelectorAll(".secnav a").forEach((a) => {
  a.addEventListener("click", (e) => {
    e.preventDefault();
    const el = document.getElementById(a.dataset.sec);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});
function spy() {
  const y = window.scrollY + 80;
  let cur = secs[0];
  for (const s of secs) {
    const el = document.getElementById(s);
    if (el && el.offsetTop <= y) cur = s;
  }
  document.querySelectorAll(".secnav a").forEach((a) => a.classList.toggle("active", a.dataset.sec === cur));
}
window.addEventListener("scroll", spy, { passive: true });

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t;
  try { localStorage.setItem("emrisearch-theme", t); } catch (e) {}
}
$("#themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});
$("#refreshBtn").addEventListener("click", () => { route(); toast("rescanned " + ROOT); });
$("#pickRootBtn").addEventListener("click", () => { $("#rootInput").click(); });
$("#rootInput").addEventListener("change", (e) => {
  const files = [...(e.target.files || [])];
  const dirs = new Set(files.map((f) => f.webkitRelativePath.split("/")[0]));
  if (dirs.size) {
    toast("root set to <b>" + esc([...dirs][0]) + "</b> (mock: run list unchanged)");
  }
  e.target.value = "";
});
$("#addRunBtn").addEventListener("click", () => {
  const panel = $("#addRunPanel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden) $("#addRunPath").focus();
});
$("#addRunGo").addEventListener("click", addRunByPath);
$("#addRunPath").addEventListener("keydown", (e) => { if (e.key === "Enter") addRunByPath(); });

function addRunByPath() {
  const input = $("#addRunPath");
  let path = input.value.trim();
  if (!path) { toast("enter a run directory path"); return; }
  path = path.replace(/\/+$/, ""); // normalize trailing separators
  const base = path.split("/").pop();
  if (!base || base === "." || base === "..") { toast("path must end in a run directory name"); return; }
  if (!/^[A-Za-z0-9._-]+$/.test(base)) { toast("run name may only contain letters, digits, dot, dash, underscore"); return; }
  if (runById(base)) { toast("run <b>" + esc(base) + "</b> is already in the list"); input.value = ""; return; }
  // mock: clone the anneal run's shape under the new id/path
  const src = runById("emri_c_anneal_s12");
  const run = JSON.parse(JSON.stringify(src));
  run.id = base;
  run.chain = "loose";
  run.manifest.out = path;
  run.manifest.seeding = { kind: "from_run", path: "../emri_c_merge_s12", n_sigma: 2 };
  run.result.plots = "unavailable";
  RUNS.push(run);
  input.value = "";
  $("#addRunPanel").hidden = true;
  toast("added run <b>" + esc(base) + "</b> from " + esc(path));
  location.hash = "#/run/" + base;
  setTimeout(() => {
    const title = document.querySelector(".run-title");
    if (title) title.setAttribute("tabindex", "-1");
    if (title) title.focus();
  }, 50);
}

function toast(html) {
  const t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role", "status");
  t.setAttribute("aria-live", "polite");
  t.innerHTML = html;
  const stack = document.querySelectorAll(".toast");
  const offset = stack.length * 44;
  t.style.top = (12 + offset) + "px";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

window.addEventListener("hashchange", () => {
  document.querySelectorAll(".modal-back").forEach((m) => {
    if (m._onKey) document.removeEventListener("keydown", m._onKey, true);
    m.remove();
  });
  route();
});applyTheme((() => { try { return localStorage.getItem("emrisearch-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch (e) { return "dark"; } })());
route();
